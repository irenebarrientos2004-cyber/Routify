<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Routify · Rutas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="cabecera">
    <a href="index.html" class="logo">Routify</a>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="rutas.html">Rutas</a>
      <a href="favoritos.html">Mis favoritas</a>
    </nav>
  </header>

  <main class="contenido">
    <h1>Rutas</h1>

    <!-- Filtros por provincia, dificultad y duración (SCRUM-28) -->
    <section id="filtros" class="filtros">
      <label>
        Provincia
        <select id="filtro-provincia">
          <option value="">Todas</option>
        </select>
      </label>
      <label>
        Dificultad
        <select id="filtro-dificultad">
          <option value="">Todas</option>
          <option value="Fácil">Fácil</option>
          <option value="Media">Media</option>
          <option value="Difícil">Difícil</option>
        </select>
      </label>
      <label>
        Duración
        <select id="filtro-duracion">
          <option value="">Cualquiera</option>
          <option value="0-2">Menos de 2 h</option>
          <option value="2-4">De 2 a 4 h</option>
          <option value="4-">Más de 4 h</option>
        </select>
      </label>
      <button type="button" id="borrar-filtros" class="boton boton-secundario">Borrar filtros</button>
    </section>

    <!-- Aquí se muestra el listado de rutas (SCRUM-33 conecta los datos, SCRUM-27 hace las tarjetas) -->
    <section id="listado-rutas">
      <p>Cargando rutas…</p>
    </section>
  </main>

  <!-- Datos de las rutas: tiene que ir ANTES de app.js -->
  <script src="data/rutas.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
